name: Week 11 iOS native builds
on:
  push:
    branches: ['week11-ios-simulator']
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: software/package-lock.json
      - name: Build and sync the shared app
        working-directory: software
        run: |
          npm ci
          npm run native:sync
      - name: Compile the iOS simulator app
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            printf 'Source: %s\n' "$(git rev-parse HEAD)"
            printf 'Source base: %s\n' "c2703bcc365cc0e62e8f41e20e396ef0e7caffd1"
            xcodebuild -version
            uname -m
            xcrun --sdk iphonesimulator --show-sdk-version
          } | tee "$RUNNER_TEMP/evidence/BUILD-INFO.txt"
          xcodebuild -project software/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/radar-derived" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/evidence/xcodebuild.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/evidence/xcodebuild.log"
              exit 1
            }
          app="$RUNNER_TEMP/radar-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$app/App"
          test -f "$app/public/index.html"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" | tee -a "$RUNNER_TEMP/evidence/BUILD-INFO.txt"
          file "$app/App" | tee -a "$RUNNER_TEMP/evidence/BUILD-INFO.txt"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/evidence/University-Radar-iOS-Simulator.zip"
          tail -3 "$RUNNER_TEMP/evidence/xcodebuild.log" | tee -a "$RUNNER_TEMP/evidence/BUILD-INFO.txt"
      - name: Install and launch on iPhone Simulator
        run: |
          sim="$(xcrun simctl list devices available -j | jq -er '[.devices | to_entries[] | select(.key | contains("iOS-26-5")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b
          app="$RUNNER_TEMP/radar-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$sim" "$app"
          xcrun simctl status_bar "$sim" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState discharging --batteryLevel 100
          capture="$RUNNER_TEMP/evidence/ios-simulator-launch.png"
          if xcrun simctl help launch | grep -q -- '--stdout'; then
            xcrun simctl launch --stdout="$RUNNER_TEMP/evidence/Simulator-App.out.txt" \
              --stderr="$RUNNER_TEMP/evidence/Simulator-App.err.txt" "$sim" com.universityradar.app \
              | tee -a "$RUNNER_TEMP/evidence/BUILD-INFO.txt"
          else
            xcrun simctl launch "$sim" com.universityradar.app | tee -a "$RUNNER_TEMP/evidence/BUILD-INFO.txt"
          fi
          cat > "$RUNNER_TEMP/check-view.swift" <<'SWIFT'
          import Foundation
          import Vision
          let req = VNRecognizeTextRequest()
          req.recognitionLevel = .accurate
          req.recognitionLanguages = ["en-US", "zh-Hans"]
          try VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1])).perform([req])
          let observed = (req.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " ")
          print(observed)
          if !observed.localizedCaseInsensitiveContains("University Radar") { exit(1) }
          SWIFT
          /usr/bin/swiftc "$RUNNER_TEMP/check-view.swift" -o "$RUNNER_TEMP/check-view"
          ready=false
          for delay in 5 10 15 15 15 15; do
            sleep "$delay"
            xcrun simctl io "$sim" screenshot "$capture"
            if "$RUNNER_TEMP/check-view" "$capture" > "$RUNNER_TEMP/evidence/Simulator-Visible-Text.txt"; then
              cat "$RUNNER_TEMP/evidence/Simulator-Visible-Text.txt"
              ready=true
              break
            fi
          done
          xcrun simctl spawn "$sim" log show --style compact --last 4m \
            --predicate 'process == "App" OR processImagePath ENDSWITH "WebContent"' \
            > "$RUNNER_TEMP/evidence/Simulator-Unified.log" || true
          if ! "$ready"; then
            cat "$RUNNER_TEMP/evidence/Simulator-App.out.txt" "$RUNNER_TEMP/evidence/Simulator-App.err.txt" || true
            echo 'The University Radar onboarding screen did not render.'
            exit 1
          fi
      - name: Compile the unsigned iPhone device build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          xcodebuild -project software/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/radar-derived" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/evidence/xcodebuild-device.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/evidence/xcodebuild-device.log"
              exit 1
            }
          app="$RUNNER_TEMP/radar-derived/Build/Products/Debug-iphoneos/App.app"
          test -f "$app/App"
          test -f "$app/public/index.html"
          {
            printf '\nUnsigned device build\n'
            xcrun --sdk iphoneos --show-sdk-version
            xcrun vtool -show-build "$app/App"
            file "$app/App"
            tail -3 "$RUNNER_TEMP/evidence/xcodebuild-device.log"
          } | tee -a "$RUNNER_TEMP/evidence/BUILD-INFO.txt"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/evidence/University-Radar-iOS-Device-Unsigned.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-radar-ios-week11
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
